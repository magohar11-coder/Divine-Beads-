<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Divine Beads - M.A. Gohar</title>
    <style>
        :root { --app-bg: #030a16; --gold: #f3ba2f; --cyan: #00d2ff; }
        body { margin: 0; background: var(--app-bg); font-family: sans-serif; color: white; height: 100vh; display: flex; justify-content: center; overflow: hidden; }
        .phone-frame { width: 100%; max-width: 450px; padding: 20px; display: flex; flex-direction: column; justify-content: space-between; border: 2px solid #1e293b; text-align: center; box-shadow: 0 0 20px rgba(0,210,255,0.2); }
        
        /* Stats Bar - Big Fonts */
        .stats-bar { background: rgba(255,255,255,0.05); border-radius: 15px; padding: 15px 10px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; border: 1px solid rgba(0,210,255,0.1); }
        .stats-bar small { display: block; font-size: 0.65rem; text-transform: uppercase; opacity: 0.8; margin-bottom: 4px; }
        .stat-val { display: block; font-size: 1.1rem; font-weight: bold; }

        .bead { position: absolute; width: 10px; height: 10px; background: radial-gradient(circle, #fff, var(--gold)); border-radius: 50%; left: 50%; transform-origin: 50% 90px; }
        .main-btn { width: 120px; height: 120px; border-radius: 50%; background: radial-gradient(circle at 30% 30%, #fcd34d, #b28924); border: 6px solid rgba(255,255,255,0.1); cursor: pointer; margin: 0 auto; transition: 0.1s; }
        .main-btn:active { transform: scale(0.9); }
        .btn-ui { background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); color: white; padding: 6px 12px; border-radius: 8px; font-size: 0.7rem; cursor: pointer;}
        
        .vol-control { display: flex; align-items: center; justify-content: center; gap: 10px; margin-top: 10px; }
        input[type=range] { width: 80px; accent-color: var(--gold); }

        .like-btn { 
            border: none; 
            background: none; 
            font-size: 1.8rem; 
            cursor: pointer; 
            transition: 0.3s; 
            padding: 0;
            display: inline-block;
        }
        .like-btn:disabled { 
            opacity: 0.6; 
            cursor: default; 
            filter: drop-shadow(0 0 5px #22c55e);
        }
    </style>
</head>
<body>

<div class="phone-frame">
    <div style="display: flex; justify-content: space-between;">
        <button class="btn-ui" onclick="reset()">RESET</button>
        <button class="btn-ui" onclick="setGoal()">TARGET</button>
    </div>

    <div>
        <h1 style="margin:0; font-size: 1.5rem;">Smart Tasbih</h1>
        <h2 style="margin:2px 0;">ایصال ثواب</h2>
        <p style="color: var(--gold); font-size: 0.75rem; margin:0;">Powered By M.A. Gohar</p>
        
        <div style="margin-top: 10px;">
            <button id="likeBtn" class="like-btn" onclick="handleLike()">💚</button>
        </div>
    </div>

    <div class="stats-bar">
        <div><small>Online Now </small><span class="stat-val" id="installCount">0</span></div>
        <div><small>Install</small><span class="stat-val" id="onlineCount" style="color:var(--cyan);">0</span></div>
        <div><small>Recite</small><span class="stat-val" id="globalCount" style="color:var(--gold);">0</span></div>
        <div><small>Likes</small><span class="stat-val" id="likeCount" style="color:#22c55e;">0</span></div>
    </div>

    <div class="vol-control">
        <small>🔈</small>
        <input type="range" id="volSlider" min="0" max="1" step="0.1" value="0.5">
        <small>🔊</small>
    </div>

    <div style="display: flex; justify-content: space-between; padding: 0 10px; font-size: 0.8rem;">
        <div align="left">Today: <b id="todayVal">0</b><br><button class="btn-ui" id="muteBtn" onclick="toggleMute()" style="margin-top:5px;">🔊 On</button></div>
        <div align="right">Goal: <b id="goalVal">100</b><br><button class="btn-ui" onclick="shareApp()" style="margin-top:5px;">🔗 Share</button></div>
    </div>

    <div style="position: relative; width: 180px; height: 180px; margin: 0 auto; display: flex; justify-content: center; align-items: center;">
        <div id="mala" style="position: absolute; width: 100%; height: 100%; transition: transform 0.2s;"></div>
        <div id="displayNum" style="font-size: 4rem; font-weight: 200;">0</div>
    </div>

    <button class="main-btn" id="pressBtn"><b style="color: #4a3700; font-size: 1.2rem;">PRESS</b></button>
</div>

<script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-app.js";
    import { getDatabase, ref, onValue, onDisconnect, runTransaction } from "https://www.gstatic.com/firebasejs/12.9.0/firebase-database.js";

    const firebaseConfig = {
        apiKey: "AIzaSyCqM0KiV0K29BIFLmRoQoX2KUVdtChrwXE",
        authDomain: "divine-beads.firebaseapp.com",
        databaseURL: "https://divine-beads-default-rtdb.firebaseio.com",
        projectId: "divine-beads",
        storageBucket: "divine-beads.firebasestorage.app",
        messagingSenderId: "589482198444",
        appId: "1:589482198444:web:1a3343eea6ef775fd4a609"
    };

    const app = initializeApp(firebaseConfig);
    const db = getDatabase(app);

    const installRef = ref(db, 'stats/total_installs');
    const onlineRef = ref(db, 'stats/online_now');
    const globalRef = ref(db, 'stats/global_recite_count');
    const likeRef = ref(db, 'stats/total_likes');

    onValue(installRef, s => document.getElementById('installCount').innerText = s.val() || 0);
    onValue(onlineRef, s => document.getElementById('onlineCount').innerText = s.val() || 0);
    onValue(globalRef, s => document.getElementById('globalCount').innerText = s.val() || 0);
    onValue(likeRef, s => document.getElementById('likeCount').innerText = s.val() || 0);

    if(!localStorage.getItem('mag_user_id')){
        runTransaction(installRef, c => (c || 0) + 1);
        localStorage.setItem('mag_user_id', 'v1_' + Date.now());
    }

    if(!sessionStorage.getItem('is_counted')){
        runTransaction(onlineRef, c => (c || 0) + 1);
        sessionStorage.setItem('is_counted', 'true');
        onDisconnect(onlineRef).runTransaction(c => (c > 0 ? c - 1 : 0));
    }

    window.logClick = () => { runTransaction(globalRef, c => (c || 0) + 1); };
    
    // Improved Like Logic
    window.handleLike = () => {
        if(!localStorage.getItem('mag_liked')) {
            runTransaction(likeRef, c => (c || 0) + 1)
            .then(() => {
                localStorage.setItem('mag_liked', 'true');
                checkLikeStatus();
            });
        }
    };

    function checkLikeStatus() {
        if(localStorage.getItem('mag_liked')) {
            const lb = document.getElementById('likeBtn');
            if(lb) {
                lb.disabled = true;
                lb.style.opacity = "0.6";
            }
        }
    }
    checkLikeStatus();
</script>

<script>
    let count = parseInt(localStorage.getItem('mag_cnt')) || 0;
    let target = parseInt(localStorage.getItem('mag_trg')) || 100;
    let muted = false;
    let volumeLevel = 0.5;
    const audioCtx = new (window.AudioContext || window.webkitAudioContext)();

    document.getElementById('volSlider').oninput = (e) => { volumeLevel = e.target.value; };

    function playBeep(delay) {
        if(muted || volumeLevel <= 0) return;
        setTimeout(() => {
            const osc = audioCtx.createOscillator();
            const g = audioCtx.createGain();
            osc.connect(g); g.connect(audioCtx.destination);
            osc.frequency.value = 880;
            g.gain.setValueAtTime(volumeLevel * 0.2, audioCtx.currentTime);
            g.gain.exponentialRampToValueAtTime(0.01, audioCtx.currentTime + 0.4);
            osc.start(); osc.stop(audioCtx.currentTime + 0.4);
        }, delay);
    }

    function update() {
        document.getElementById('displayNum').innerText = count;
        document.getElementById('todayVal').innerText = count;
        document.getElementById('goalVal').innerText = target;
        document.getElementById('mala').style.transform = `rotate(-${count * 10.9}deg)`;
        
        if(count == target && target > 0) {
            playBeep(0); playBeep(500); playBeep(1000); 
            if(navigator.vibrate) navigator.vibrate([200, 100, 200, 100, 200]);
        }
        localStorage.setItem('mag_cnt', count);
    }

    document.getElementById('pressBtn').onclick = () => {
        if(audioCtx.state === 'suspended') audioCtx.resume();
        count++; update();
        if(window.logClick) window.logClick();
    };

    function reset() { if(confirm("Reset Count?")) { count = 0; update(); } }
    function setGoal() { let v = prompt("Set Target:", target); if(v) { target = parseInt(v); update(); localStorage.setItem('mag_trg', target); } }
    function toggleMute() { muted = !muted; document.getElementById('muteBtn').innerText = muted ? '🔇 Off' : '🔊 On'; }
    function shareApp() { window.open(`https://wa.me/?text=My Dhikr Count: ${count}. Join me: ${window.location.href}`); }

    const mala = document.getElementById('mala');
    for(let i=0; i<33; i++) {
        let b = document.createElement('div'); b.className = 'bead';
        b.style.transform = `translateX(-50%) rotate(${i * 10.9}deg)`;
        mala.appendChild(b);
    }
    update();
</script>
</body>
</html>
